<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Persian Tutor</title>
    <!-- GitHub Pages SPA fallback: stash the deep link and bounce to index.html -->
    <script type="text/javascript">
      (function (l) {
        var pathSegmentsToKeep = 1;
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname
              .split('/')
              .slice(0, 1 + pathSegmentsToKeep)
              .join('/') +
            '/?/' +
            l.pathname
              .slice(1)
              .split('/')
              .slice(pathSegmentsToKeep)
              .join('/')
              .replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash,
        );
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
